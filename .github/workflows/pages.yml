name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Public URL of the deployed backend, e.g. https://api.example.com
          # Set it in Settings → Secrets and variables → Actions → Variables → VITE_API_URL
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Repository variable VITE_API_URL is not set — the site will show 'Backend API unreachable' until a backend URL is configured."
          fi
          npm run build
          # SPA deep links (/crypto-insight/analysis/BTCUSDT) → serve the app for unknown paths
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
